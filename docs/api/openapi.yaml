components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
            required:
            - field
            - message
            - code
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - code
      - correlationId
    CsrfToken:
      type: object
      additionalProperties: false
      properties:
        headerName:
          type: string
          enum:
          - X-CSRF-Token
        token:
          type: string
          minLength: 1
      required:
      - headerName
      - token
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not be whitespace-only.
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
          description: 12–128 Unicode code points; no trimming; UTF-8 at most 512 bytes.
      required:
      - email
      - displayName
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          writeOnly: true
          description: 1–128 Unicode code points; UTF-8 at most 512 bytes. No trimming, normalization or
            truncation. The registration minimum of 12 code points is not imposed at login.
      required:
      - email
      - password
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not be whitespace-only.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - email
      - displayName
      - isActive
      - createdAt
      - updatedAt
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          enum:
          - 900
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
    CreateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Trimmed; must not be whitespace-only.
        description:
          type: string
          maxLength: 4000
          nullable: true
          description: Null clears description.
      required:
      - name
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Trimmed; must not be whitespace-only.
        description:
          type: string
          maxLength: 4000
          nullable: true
          description: Null clears description.
      required: []
      minProperties: 1
    Project:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Trimmed; must not be whitespace-only.
        description:
          type: string
          maxLength: 4000
          nullable: true
          description: Null clears description.
        createdBy:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - archived
        myRole:
          type: string
          enum:
          - owner
          - member
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - createdBy
      - status
      - myRole
      - createdAt
      - updatedAt
    Member:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not be whitespace-only.
        role:
          type: string
          enum:
          - owner
          - member
        joinedAt:
          type: string
          format: date-time
      required:
      - userId
      - displayName
      - role
      - joinedAt
    AddMemberRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
      required:
      - email
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      properties:
        newOwnerUserId:
          type: string
          format: uuid
      required:
      - newOwnerUserId
    ProjectPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    MemberPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
