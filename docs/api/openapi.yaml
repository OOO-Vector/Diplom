  /api/v1/projects/{projectId}/specifications:
    parameters:
    - $ref: '#/components/parameters/SpecificationProjectId'
    post:
      tags: [Specifications]
      operationId: uploadSpecification
      summary: Import an immutable specification version
      description: >-
        Owner or Member of an active project. Multipart form-data with exactly one file part and one title field.
        Missing, duplicate, unknown or wrongly typed parts and query parameters are rejected with 400 VALIDATION_ERROR.
        Original filename comes exclusively from the file part Content-Disposition, never from a query parameter.
        Actor and version are server assigned.
        At most 10 MiB per file, 11 MiB for the entire request including multipart overhead, and 200000 extracted Unicode code points.
        Multipart part headers are limited to 4 KiB.
        Title is UTF-8, at most 800 bytes and 200 Unicode code points after trimming. UTF-8 TXT (optional BOM) or text-layer PDF only;
        filename extension and media type must agree with validated content. No OCR or execution of document instructions.
        Filenames are reduced to a basename; control/format and unsafe filename punctuation are replaced with underscores.
        Invalid/empty/encrypted/image-only documents return 400 INVALID_SPECIFICATION. Invalid metadata returns 400 VALIDATION_ERROR.
        File or multipart request size returns 413 PAYLOAD_TOO_LARGE; text length returns 413 SPECIFICATION_TEXT_TOO_LARGE.
        Archived projects return 409 PROJECT_ARCHIVED; exhausted integer versions return 409 SPECIFICATION_VERSION_LIMIT.
        PDF processing bounds (1000 pages, 400000 glyphs, 1000000 operators, cooperative 10-second budget) return 422 SPECIFICATION_PROCESSING_LIMIT.
        Two concurrent extraction slots per process; saturation returns 429 IMPORT_BUSY. Retry later without automatic retry of a committed upload.
        Each successful upload creates a new version; no idempotency key is supported.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                  description: TXT/PDF; sanitized filename must contain 1–255 Unicode characters and end in .txt or .pdf.
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed nonblank UTF-8 title; no control characters.
            encoding:
              file:
                contentType: text/plain, application/pdf
              title:
                contentType: text/plain; charset=UTF-8
      responses:
        '201':
          description: Version committed; no decomposition started
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpecificationMetadata'}
        '400': {$ref: '#/components/responses/SpecificationProblem'}
        '401': {$ref: '#/components/responses/SpecificationAuthenticationRequired'}
        '404': {$ref: '#/components/responses/SpecificationProblem'}
        '409': {$ref: '#/components/responses/SpecificationProblem'}
        '413': {$ref: '#/components/responses/SpecificationProblem'}
        '415': {$ref: '#/components/responses/SpecificationProblem'}
        '422': {$ref: '#/components/responses/SpecificationProblem'}
        '429': {$ref: '#/components/responses/SpecificationProblem'}
        '500': {$ref: '#/components/responses/SpecificationProblem'}
    get:
      tags: [Specifications]
      operationId: listSpecifications
      summary: List accessible specification metadata, newest version first
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: size
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Member-scoped paginated history, including archived projects; no document text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpecificationPage'}
        '400': {$ref: '#/components/responses/SpecificationProblem'}
        '401': {$ref: '#/components/responses/SpecificationAuthenticationRequired'}
        '404': {$ref: '#/components/responses/SpecificationProblem'}
        '500': {$ref: '#/components/responses/SpecificationProblem'}
  /api/v1/projects/{projectId}/specifications/{specificationId}:
    parameters:
    - $ref: '#/components/parameters/SpecificationProjectId'
    - $ref: '#/components/parameters/SpecificationId'
    get:
      tags: [Specifications]
      operationId: getSpecification
      summary: Get metadata for a member-accessible version
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpecificationMetadata'}
        '400': {$ref: '#/components/responses/SpecificationProblem'}
        '401': {$ref: '#/components/responses/SpecificationAuthenticationRequired'}
        '404': {$ref: '#/components/responses/SpecificationProblem'}
        '500': {$ref: '#/components/responses/SpecificationProblem'}
  /api/v1/projects/{projectId}/specifications/{specificationId}/text:
    parameters:
    - $ref: '#/components/parameters/SpecificationProjectId'
    - $ref: '#/components/parameters/SpecificationId'
    get:
      tags: [Specifications]
      operationId: getSpecificationText
      summary: Get extracted text without interpreting document instructions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: UTF-8 plain text; no-store and nosniff; never HTML
          content:
            text/plain:
              schema: {type: string, minLength: 1, maxLength: 200000}
        '400': {$ref: '#/components/responses/SpecificationProblem'}
        '401': {$ref: '#/components/responses/SpecificationAuthenticationRequired'}
        '404': {$ref: '#/components/responses/SpecificationProblem'}
        '500': {$ref: '#/components/responses/SpecificationProblem'}
components:
  parameters:
    SpecificationProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SpecificationId:
      name: specificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    SpecificationProblem:
      description: >-
        Generic Problem Details. Inaccessible project or nested version uses PROJECT_NOT_FOUND (404);
        malformed parameters use VALIDATION_ERROR (400); unsupported media/extension uses UNSUPPORTED_MEDIA_TYPE (415).
        Import-specific limits and invalid documents are described on uploadSpecification. Unexpected failures use INTERNAL_ERROR (500).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SpecificationAuthenticationRequired:
      description: Missing/invalid bearer token or inactive account (AUTH_REQUIRED)
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    SpecificationMetadata:
      type: object
      additionalProperties: false
      required: [id, projectId, uploadedBy, version, title, originalFilename, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        uploadedBy: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        originalFilename: {type: string, nullable: true, maxLength: 255}
        status: {type: string, enum: [uploaded, processing, processed, failed]}
        createdAt: {type: string, format: date-time}
    SpecificationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SpecificationMetadata'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
            required:
            - field
            - message
            - code
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - code
      - correlationId
    CsrfToken:
      type: object
      additionalProperties: false
      properties:
        headerName:
          type: string
          enum:
          - X-CSRF-Token
        token:
          type: string
          minLength: 1
      required:
      - headerName
      - token
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not be whitespace-only.
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
          description: 12–128 Unicode code points; no trimming; UTF-8 at most 512 bytes.
      required:
      - email
      - displayName
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trim before validation; case-insensitive identity.
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          writeOnly: true
          description: 1–128 Unicode code points; UTF-8 at most 512 bytes. No trimming, normalization or
            truncation. The registration minimum of 12 code points is not imposed at login.
      required:
      - email
      - password
    User:
      type: object
      additionalProperties: false
      properties:
        id:
