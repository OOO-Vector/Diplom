openapi: 3.0.3
info:
  title: Team AI Orchestrator — Public REST API
  version: 0.1.0
  description: Core & Access API contract. CSRF bootstrap, registration, login and current user are implemented
    for CORE-02/03 review; refresh, logout and project/member routes remain planned. Deployment is not claimed.
servers:
- url: http://localhost:8080
  description: Proposed local API (use same-origin HTTPS/proxy for secure cookie flows)
- url: /
  description: Same-origin deployment
tags:
- name: Authentication
- name: Users
- name: Projects
- name: Members
paths:
  /api/v1/auth/csrf:
    get:
      tags:
      - Authentication
      summary: Bootstrap CSRF protection
      description: Same-origin browser obtains a header token and a matching HttpOnly cookie. Re-fetch after
        login/logout or CSRF rejection. No bearer token needed.
      operationId: getCsrfToken
      security: []
      x-requirements:
      - DEC-02
      - NFR-SEC-006
      responses:
        '200':
          description: CSRF bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              example:
                headerName: X-CSRF-Token
                token: example-csrf-token
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              schema:
                type: string
              description: csrf_token; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth
        '429':
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Too many requests
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until another request may be attempted.
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:internal-error
                title: Unexpected server failure
                status: 500
                code: INTERNAL_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unexpected server failure
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a user
      description: Creates an active account, no session issued. CSRF required. Duplicate case-insensitive
        email returns 409. Request body is limited to 16 KiB; JSON scalar types are not coerced.
      operationId: register
      security:
      - csrfCookie: []
        csrfHeader: []
      x-requirements:
      - FR-AUTH-001
      - FR-AUTH-006
      - BR-001
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                email: owner@example.test
                displayName: Project Owner
                isActive: true
                createdAt: '2026-11-17T12:00:00Z'
                updatedAt: '2026-11-17T12:00:00Z'
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:validation-error
                title: Invalid request
                status: 400
                code: VALIDATION_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Invalid request
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '403':
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:csrf-invalid
                title: CSRF validation failed
                status: 403
                code: CSRF_INVALID
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: CSRF validation failed
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:email-already-exists
                title: Email already registered
                status: 409
                code: EMAIL_ALREADY_EXISTS
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Email already registered
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '413':
          description: Request exceeds size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:payload-too-large
                title: Request exceeds size limit
                status: 413
                code: PAYLOAD_TOO_LARGE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Request exceeds size limit
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:unsupported-media-type
                title: Unsupported media type
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unsupported media type
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '429':
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Too many requests
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until another request may be attempted.
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:internal-error
                title: Unexpected server failure
                status: 500
                code: INTERNAL_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unexpected server failure
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: owner@example.test
              displayName: Project Owner
              password: example-password-only
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate
      description: Valid active account creates independent refresh family and access JWT. Invalid credentials/inactive
        account indistinguishable. CSRF required. Request body is limited to 16 KiB; JSON scalar types are not coerced.
      operationId: login
      security:
      - csrfCookie: []
        csrfHeader: []
      x-requirements:
      - FR-AUTH-002
      - FR-AUTH-006
      - DEC-02
      responses:
        '200':
          description: Signed-in account and access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: example-not-a-real-jwt
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                  email: owner@example.test
                  displayName: Project Owner
                  isActive: true
                  createdAt: '2026-11-17T12:00:00Z'
                  updatedAt: '2026-11-17T12:00:00Z'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              description: Refresh cookie issued/rotated with HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth.
                CSRF cookie may be rotated/cleared separately. Multiple Set-Cookie header lines; not a comma-joined
                list.
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:validation-error
                title: Invalid request
                status: 400
                code: VALIDATION_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Invalid request
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:invalid-credentials
                title: Invalid credentials
                status: 401
                code: INVALID_CREDENTIALS
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Invalid credentials
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge for protected bearer endpoints; not required for cookie or login
                failures.
        '403':
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:csrf-invalid
                title: CSRF validation failed
                status: 403
                code: CSRF_INVALID
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: CSRF validation failed
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '413':
          description: Request exceeds size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:payload-too-large
                title: Request exceeds size limit
                status: 413
                code: PAYLOAD_TOO_LARGE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Request exceeds size limit
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:unsupported-media-type
                title: Unsupported media type
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unsupported media type
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '429':
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Too many requests
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until another request may be attempted.
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:internal-error
                title: Unexpected server failure
                status: 500
                code: INTERNAL_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unexpected server failure
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '503':
          description: Service temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:service-unavailable
                title: Service temporarily unavailable
                status: 503
                code: SERVICE_UNAVAILABLE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Service temporarily unavailable
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: owner@example.test
              password: example-password-only
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate refresh credential
      description: No JSON body. Atomically consume old refresh and issue replacement in the same family (absolute
        7-day lifetime); replay revokes family. Do not blindly retry; on invalid/expired/replayed credential
        clear cookie and return 401. Requires CSRF.
      operationId: refresh
      security:
      - refreshCookie: []
        csrfCookie: []
        csrfHeader: []
      x-requirements:
      - FR-AUTH-002
      - DEC-02
      - FR-AUTH-003
      responses:
        '200':
          description: Rotated credential and new access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: example-not-a-real-jwt
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                  email: owner@example.test
                  displayName: Project Owner
                  isActive: true
                  createdAt: '2026-11-17T12:00:00Z'
                  updatedAt: '2026-11-17T12:00:00Z'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              description: Refresh cookie issued/rotated with HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth.
                CSRF cookie may be rotated/cleared separately. Multiple Set-Cookie header lines; not a comma-joined
                list.
              schema:
                type: string
        '401':
          description: Refresh credential invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:refresh-invalid
                title: Refresh credential invalid
                status: 401
                code: REFRESH_INVALID
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Refresh credential invalid
          headers:
            Set-Cookie:
              description: Required on invalid, expired or replayed refresh. Clear refresh_token with empty value,
                Max-Age=0, HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth and no Domain (host-only).
                Use separate Set-Cookie lines for any additional cookie clearing.
              schema:
                type: string
              example: refresh_token=; Path=/api/v1/auth; Max-Age=0; Secure; HttpOnly; SameSite=Lax
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge for protected bearer endpoints; not required for cookie or login
                failures.
        '403':
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:csrf-invalid
                title: CSRF validation failed
                status: 403
                code: CSRF_INVALID
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: CSRF validation failed
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '429':
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Too many requests
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until another request may be attempted.
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:internal-error
                title: Unexpected server failure
                status: 500
                code: INTERNAL_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unexpected server failure
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '503':
          description: Service temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:service-unavailable
                title: Service temporarily unavailable
                status: 503
                code: SERVICE_UNAVAILABLE
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Service temporarily unavailable
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Requires CSRF; refresh cookie optional. No request body, no bearer requirement. Existing
        access JWT may remain valid until expiry; client clears it immediately.
      operationId: logout
      security:
      - csrfCookie: []
        csrfHeader: []
      x-requirements:
      - FR-AUTH-003
      - DEC-02
      responses:
        '204':
          description: Refresh family revoked if present; cookie cleared. Idempotent even when no valid refresh
            cookie exists.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Clear refresh_token with matching Path and attributes, Max-Age=0; clear/rotate CSRF
                cookie as implemented.
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '403':
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:csrf-invalid
                title: CSRF validation failed
                status: 403
                code: CSRF_INVALID
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: CSRF validation failed
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
        '429':
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Too many requests
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
              schema:
                type: string
                enum:
                - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until another request may be attempted.
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:team-ai:problem:internal-error
                title: Unexpected server failure
                status: 500
                code: INTERNAL_ERROR
                correlationId: 3e0e8a7a-a805-4558-89a1-2411d51d1531
                detail: Unexpected server failure
          headers:
            Cache-Control:
              description: Required on every auth response, including errors.
