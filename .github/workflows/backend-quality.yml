name: Backend quality
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify backend and contract
        run: bash ./gradlew clean test securitySpike schemaTest openApiValidate jacocoTestReport jacocoTestCoverageVerification bootJar --rerun-tasks --console=plain
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-${{ github.sha }}
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            backend/build/reports/jacoco/
            backend/build/reports/contracts/
          if-no-files-found: warn
          retention-days: 14
