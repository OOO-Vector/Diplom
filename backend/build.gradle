plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teamai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// SET-01: isolated library/protocol experiment; never included in the application jar.
sourceSets {
	securitySpike
}

dependencies {
	securitySpikeImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	securitySpikeImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
	securitySpikeImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	securitySpikeImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	securitySpikeImplementation 'org.bouncycastle:bcprov-jdk18on:1.87'
	securitySpikeRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('securitySpike', Test) {
	description = 'Runs SET-01 security experiments without application startup or database access.'
	group = 'verification'
	testClassesDirs = sourceSets.securitySpike.output.classesDirs
	classpath = sourceSets.securitySpike.runtimeClasspath
	useJUnitPlatform()
}

// Real migration tests in disposable PostgreSQL containers, without Spring app startup.
sourceSets {
	schemaTest {
		resources.srcDir 'src/main/resources'
	}
}

dependencies {
	schemaTestImplementation 'org.springframework.boot:spring-boot-starter-test'
	schemaTestImplementation 'org.liquibase:liquibase-core'
	schemaTestImplementation 'org.postgresql:postgresql'
	schemaTestImplementation 'org.testcontainers:testcontainers-postgresql'
	schemaTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('schemaTest', Test) {
	description = 'Verifies Liquibase clean install, upgrade, refresh constraints and grants on PostgreSQL 16/pgvector.'
	group = 'verification'
	testClassesDirs = sourceSets.schemaTest.output.classesDirs
	classpath = sourceSets.schemaTest.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = 1
}
