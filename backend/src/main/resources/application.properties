spring.application.name=team-ai-orchestrator
# Servlet multipart parsing bounds: 10 MiB file plus 1 MiB envelope; spill immediately, cleaned per request.
spring.servlet.multipart.max-file-size=10485760B
spring.servlet.multipart.max-request-size=11534336B
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.strict-servlet-compliance=true
# Preserve Unicode filenames within the existing 255-code-point contract, with bounded part headers.
server.tomcat.max-part-header-size=4096B
# Bounded draining of rejected uploads lets clients receive the 413 response.
server.tomcat.max-swallow-size=12582912B
# PDF parsers can include document-controlled values in diagnostic messages.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
app.security.allowed-origins=${APP_ALLOWED_ORIGINS}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.audience=${JWT_AUDIENCE}
app.security.jwt.key-id=${JWT_KEY_ID}
app.security.jwt.private-key=${JWT_PRIVATE_KEY}
app.security.jwt.public-key=${JWT_PUBLIC_KEY}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/team_ai_db
spring.datasource.username=team_ai_app
spring.datasource.password=${DB_APP_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://localhost:5433/team_ai_db
spring.liquibase.user=team_ai_admin
spring.liquibase.password=${DB_PASSWORD}
